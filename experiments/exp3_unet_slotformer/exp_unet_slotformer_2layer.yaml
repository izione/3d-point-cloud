# Experiment 3 (backbone-architecture comparison series): full encoder-decoder
# ("unet") structure, 2 stages, residual blocks replaced by SlotFormer(3L) in EVERY
# stage (encoder AND decoder). See models/backbone3d_slot_unet.py's module docstring.
#
# One of 3 siblings in this folder varying STAGE_CHANNELS depth (2/3/4 layers) --
# this file fixes 2 layers, jumping straight 64->128 (skips the 96 mid-width used by
# the deeper siblings) so all three siblings still end at the same head input width
# (128), isolating depth as the only difference between them. This is the shallowest/
# cheapest of the three and a reasonable one to measure first.
#
# Always fully restores resolution (encoder depth == decoder depth by construction).
#
# python train.py --config experiments/exp3_unet_slotformer/exp_unet_slotformer_2layer.yaml --ckpt_dir checkpoints_exp3_unet_2layer
BASE_CONFIG: ../../configs/default.yaml

BACKBONE:
  TYPE: sparse_slot_unet
  STAGE_CHANNELS: [64, 128]   # 2 layers -- this experiment's fixed axis value
  NUM_BLOCKS_PER_STAGE: 0      # unused (no residual blocks anywhere in this backbone) --
                                # kept only because config_utils/detector.py require the key
  DOWNSAMPLE_KERNEL: 3
  DOWNSAMPLE_STRIDE: 2
  SLOTFORMER_WIN_SIZE: 12
  SLOTFORMER_NUM_CYCLES: 1    # 3L per stage, both encoder and decoder
  SLOTFORMER_NUM_HEADS: 4

SLOTFORMER:
  ENABLED: false   # SlotFormer runs INSIDE every encoder/decoder stage here (BACKBONE.SLOTFORMER_*
                    # above) -- must stay false here or detector.py attaches yet another one.

# NOT measured on real hardware yet -- likely the cheapest of the 3 depth siblings
# in this folder (fewest encoder+decoder stage pairs: 2x2=4 vs 4x2=8 for the 4-layer
# sibling), but re-measure via train.py before trusting these placeholder values.
OPTIMIZATION:
  BATCH_SIZE: 8
  LR: 0.00424   # sqrt-scaled (0.003 * sqrt(8/4)) pre-emptively.
  NUM_EPOCHS: 20
