# Experiment 5: sparse 3D U-Net backbone (encoder-decoder + skip connections,
# see models/backbone3d_unet.py) in place of the single-stage encoder-only
# backbone + SlotFormer. The decoder restores full input resolution
# (total_stride=1) before the head instead of relying on SlotFormer's
# long-range attention to make up for a coarser encoder-only output -- see
# backbone3d_unet.py's module docstring for the full reasoning (short version:
# the old 4-stage/stride-16 backbone regression was probably a lost-resolution
# problem, which SlotFormer's added context never actually fixed).
#
# STAGE_CHANNELS below is a real 3-stage encoder, not matched 1:1 to
# default.yaml's current 1-stage BACKBONE section -- the whole point of
# adding a decoder is that a deeper encoder no longer costs head resolution,
# so this experiment is deliberately testing "can we go back to something
# like the old deeper encoder now that a decoder restores resolution
# afterward" alongside "do we still need SlotFormer at all".
#
# python train.py --config configs/exp_sparse_unet.yaml --ckpt_dir checkpoints_sparse_unet
BASE_CONFIG: default.yaml

BACKBONE:
  TYPE: sparse_unet
  STAGE_CHANNELS: [32, 48, 64]     # 2026-09-02: cut roughly in half (was [64,96,128]) -- a real Colab
                                    # run at the old width measured ~3h20m/epoch *on an A100* (NUM_EPOCHS=20
                                    # would be ~66h total). Confirmed this isn't a vectorization bug
                                    # (sparse_ops.SparseInverseConv3d is already gather+einsum, no k^3
                                    # Python loop) -- it's the decoder's shallowest stage doing real
                                    # conv+residual work at close to the *full, pre-downsample* active-voxel
                                    # count (the whole point of restoring resolution), which a narrower
                                    # width directly cuts the cost of. Re-measure with the timed cell in
                                    # colab_train.ipynb's step 5 before trusting this width either.
  NUM_BLOCKS_PER_STAGE: 1           # cut from 2 -- halves the encoder's per-stage conv count too
  DECODER_BLOCKS_PER_STAGE: 1       # cut from 2 -- this is the more expensive half (see STAGE_CHANNELS
                                    # comment: shallow decoder stages see the most voxels), so shrinking
                                    # it matters more per-layer than the encoder's
  DECODER_OUT_CHANNELS: 64          # matches the new STAGE_CHANNELS[0] exactly now (no upward projection
                                    # needed) -- smaller than the other exp_*.yaml's 128 head input width,
                                    # which is an intentional part of the same cost-cutting; revisit once
                                    # this config's own wall-clock time is actually tractable.
  # DOWNSAMPLE_KERNEL / DOWNSAMPLE_STRIDE inherited from default.yaml (3 / 2, isotropic).

SLOTFORMER:
  ENABLED: false   # this experiment's question is specifically "does the U-Net's own encoder
                    # bottleneck give enough context without SlotFormer on top". If precision/recall
                    # comes in worse than exp_sparse_slotformer_3l, the next thing to try is a
                    # exp_sparse_unet_slotformer.yaml with ENABLED: true instead of assuming U-Net
                    # alone is a strict upgrade.

# NOT measured on real hardware yet at this (shrunk) width -- the previous width's real Colab
# measurement (~3h20m/epoch on an A100, see STAGE_CHANNELS comment) is why this got cut down;
# BATCH_SIZE/LR below are unchanged from that measurement and still need re-checking at the new,
# smaller width via colab_train.ipynb's step 5 (both memory AND the new timing print) before a full run.
OPTIMIZATION:
  BATCH_SIZE: 8
  LR: 0.006
  NUM_EPOCHS: 6   # cut from default.yaml's 20 -- a directional signal (is sparse_unet even in the
                  # ballpark of exp_sparse_slotformer_3l's val_loss) matters more here than a fully
                  # converged model, given the wall-clock cost; bump back up once the per-epoch time
                  # at this shrunk width is confirmed tractable
