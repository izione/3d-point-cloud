# Experiment 2 (backbone-architecture comparison series): 4-stage downsample sparse
# encoder -> SlotFormer(6L, at the bottleneck) -> 3-stage upsample decoder (1/2
# resolution, one downsample stage left un-decoded). See
# models/backbone3d_down_slot_up.py's module docstring.
#
# One of 6 siblings in this folder varying two axes:
#   SlotFormer depth (3L=NUM_CYCLES:1 / 6L=NUM_CYCLES:2) x UPSAMPLE_STAGES (2/3/4)
# This file: 6L x up=3.
#
# This exact combination is the one actively training as
# configs/exp_sparse_down4_slot_up.yaml at the time this series was split out --
# measured real (train.py, RTX 2070, 277 steps/~10min): memory crept 5.96->6.99 GiB
# then plateaued (~85% of 8GiB), ~2.2s/it -> ~2h/epoch -> ~40h for 20 epochs. This
# file is a renamed copy for the new experiments/ organization; the live run keeps
# using the original path/ckpt_dir until it finishes.
#
# python train.py --config experiments/exp2_down_slot_up/exp_slotformer_4down_3up_6l.yaml --ckpt_dir checkpoints_exp2_4down_3up_6l
BASE_CONFIG: ../../configs/default.yaml

BACKBONE:
  TYPE: sparse_down_slot_up
  STAGE_CHANNELS: [64, 96, 128, 128]
  NUM_BLOCKS_PER_STAGE: 2
  DOWNSAMPLE_KERNEL: 3
  DOWNSAMPLE_STRIDE: 2
  UPSAMPLE_STAGES: 3
  DECODER_BLOCKS_PER_STAGE: 2
  SLOTFORMER_WIN_SIZE: 12
  SLOTFORMER_NUM_CYCLES: 2   # 6L
  SLOTFORMER_NUM_HEADS: 4

SLOTFORMER:
  ENABLED: false   # SlotFormer runs INSIDE this backbone (BACKBONE.SLOTFORMER_* above) --
                    # must stay false here or detector.py attaches a second, redundant one.

# Measured real (see header) at batch=8: ~85% GPU memory, ~2.2s/it, ~2h/epoch.
OPTIMIZATION:
  BATCH_SIZE: 8
  LR: 0.00424   # sqrt-scaled (0.003 * sqrt(8/4)) -- SlotFormer present.
  NUM_EPOCHS: 20
