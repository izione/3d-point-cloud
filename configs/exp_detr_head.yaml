# DETR-style set-prediction head (models/detector_detr.py) -- adapted from
# SparseVoxFormer (arXiv 2503.08092) as closely as this dataset's scale
# reasonably allows. Overrides DATA.POINT_CLOUD_RANGE to match this sonar
# rig's actual coverage; everything else in DATA/BACKBONE/SLOTFORMER/
# OPTIMIZATION stays as configs/default.yaml so the trunk/training regime
# still matches the existing dense-head baseline as closely as possible.
BASE_CONFIG: default.yaml

DATA:
  # x:[0,12], y:[-5,5], z:[-2.5,2.5] meters -- this sonar's actual field of
  # view/range, tighter than default.yaml's [0,16.2]x[-11.4,11.4]x[-5.6,5.6]
  # (that range was tuned for the dense-head baseline's own experiments).
  # VOXEL_SIZE stays 0.2m (inherited) -> grid (60,50,25).
  POINT_CLOUD_RANGE: [0.0, -5.0, -2.5, 12.0, 5.0, 2.5]

VFE:
  TYPE: mvfe                # SparseVoxFormer's "mVFE" (models/vfe_m.py): base VFE's
                             # 10D input + per-voxel std-dev(3) + point count(1) = 14D

DETR_HEAD:
  NUM_QUERIES: 100         # bumped from 24 -- still far below the paper's 900 (sized for a full
                            # driving scene), but enough slack that query denoising (below) has
                            # a real number of "empty" queries to also learn "no object" on.
  NUM_DECODER_LAYERS: 6    # matches the paper's decoder depth
  NUM_HEADS: 4
  HIDDEN_DIM: 128          # defaults to BACKBONE.STAGE_CHANNELS[-1] (channels) if omitted
  NUM_HIDDEN_LAYERS: 1     # per-head MLP depth in models/heads_detr.py

REFINEMENT:
  # Sparse-token refinement stage run after the backbone, before the DETR
  # decoder. SparseVoxFormer's own paper uses DSVT (models/dsvt.py) here for
  # its Deep Fusion Module -- switch TYPE to slotformer to fall back to this
  # codebase's pre-existing SlotFormerBackbone (a different paper, FSHNet)
  # for comparison; SLOTFORMER's own config section below is then read instead.
  TYPE: dsvt
  # Window shapes in BACKBONE-OUTPUT voxel units (effective voxel size 0.4m at
  # this config's grid). Post-backbone grid is ~(30,25,13); z stays fully
  # covered by both windows (13) rather than collapsed to 1, matching the
  # paper's own DFM usage (window_shape=[24,24,11] -- they don't flatten z
  # either). Two shapes alternate per block ("hybrid window design").
  WINDOW_SHAPES: [[10, 10, 13], [15, 13, 13]]
  TAU: 32              # max voxels per set (paper: 36 for their pillar variant, 48 for voxel --
                        # picked lower since this dataset's voxels are far sparser than outdoor LiDAR)
  NUM_BLOCKS: 4         # matches the paper's Waymo-pillar depth (2 layers/block = 8 attention layers total)
  NUM_HEADS: 4

MATCHER:
  COST_CLS: 1.0
  COST_CENTER: 5.0
  COST_SIZE: 2.0
  COST_ROT: 2.0

DENOISING:
  # DN-DETR-style auxiliary queries built directly from noised GT boxes
  # (models/denoising.py), matching the paper's own "query denoising" training
  # trick. Training-only -- has no effect on decode()/inference.
  ENABLED: true
  NUM_GROUPS: 5             # independently-noised copies of each frame's GT boxes per step
  CENTER_NOISE_SCALE: 0.4   # center jitter, as a fraction of the GT box's own half-size
  SIZE_NOISE_SCALE: 0.4     # multiplicative size jitter fraction
  ROT_NOISE_DEG: 15.0       # max random rotation perturbation angle
  LOSS_WEIGHT: 1.0          # scales the denoising loss terms before adding to the matching loss's total

DETR_LOSS:
  WEIGHTS:
    cls: 1.0
    center: 2.0
    size: 1.0
    rotation: 1.0
  CLS_ALPHA: 0.25          # standard RetinaNet/DETR focal-loss defaults (hard 0/1 target,
  CLS_GAMMA: 2.0            # not this repo's heatmap-style FOCAL_ALPHA/BETA -- see losses_detr.py)

OPTIMIZATION:
  # default.yaml's BATCH_SIZE=64/LR=0.048 were tuned for the DENSE head's
  # per-voxel conv cost on an RTX 2070 -- confirmed (2026-09-21 Colab run) that
  # BATCH_SIZE=64 OOMs within a few steps on a 14.56GiB T4 with this DETR head,
  # even on the pure-PyTorch backbone fallback. The decoder's cross-attention
  # costs O(B x T_max x Q) memory per layer (T_max = that batch's largest
  # active-token count, Q = NUM_QUERIES + denoising queries) -- a fundamentally
  # different profile from the dense head's conv, so its batch size doesn't
  # transfer. Retune upward only after checking real headroom on your GPU (the
  # notebook's step 5 speed/memory check) -- this is a conservative starting
  # point, not a measured optimum.
  BATCH_SIZE: 8
  LR: 0.006                # linear-scaled from default.yaml's own anchor (LR=0.003 at BATCH_SIZE=4)
  NUM_WORKERS: 2            # matches the "suggested max workers" warning on a 2-CPU-core Colab instance
